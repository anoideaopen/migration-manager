name: Release

on:
  workflow_dispatch: # workflow_dispatch must be enabled in main branch to support release action on older release branches
  push:
    tags:
      - 'v*'

env:
  UBUNTU_VER: 24.04
  APP_VER: ${{ github.ref_name }}
  COMMIT: ${{ github.sha }}

permissions:
  contents: read

jobs:
  # build native images using a different runner for each architecture (faster and more reliable than using qemu to build multi-architecture images on ubuntu-24.04)
  build-and-push-native-docker-images:
    name: Build and Push native images
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04 # creates linux-amd64 images
          - ubuntu-24.04-arm # creates linux-arm64 images

    steps:
      - name: Store build timestamp
        run: echo "BUILD_TIME=$(date -u +'%F_%T')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set GO_VER from go.mod
        run: echo "GO_VER=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_ENV"

      - name: Login to the docker.com Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: scientificideas/migration-manager

      - name: Build and push migration-manager Image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VER=${{ env.APP_VER }}
            COMMIT=${{ env.COMMIT }}
            UBUNTU_VER=${{ env.UBUNTU_VER }}
            GO_VER=${{ env.GO_VER }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          outputs: type=image,"name=scientificideas/migration-manager",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests/migration-manager
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/migration-manager/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-migration-manager-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/migration-manager/*
          if-no-files-found: error
          retention-days: 1

  # This job merges the architecture-specific digests for the images created above
  # and creates a multi-architecture image manifest with user-friendly tags
  merge-and-push-multi-arch-image:
    name: Merge and Push multi-arch image
    runs-on: ubuntu-24.04
    needs:
      - build-and-push-native-docker-images

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests/migration-manager
          pattern: digests-migration-manager-*
          merge-multiple: true

      - name: Login to the docker.com Container Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: scientificideas/migration-manager
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}

      - name: Create manifest list and push # combines the downloaded amd64 and arm64 digests and pushes multi-architecture manifest with the tags specified above
        working-directory: ${{ runner.temp }}/digests/migration-manager
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'scientificideas/migration-manager@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect scientificideas/migration-manager:${{ steps.meta.outputs.version }}

  create-release:
    name: Create GitHub Release
    runs-on: 'ubuntu-24.04'

    needs:
      - merge-and-push-multi-arch-image

    permissions:
      contents: write
      packages: write

    strategy:
      matrix:
        include:
          - target: linux
            arch: amd64
          - target: linux
            arch: arm64
          - target: darwin
            arch: amd64
          - target: darwin
            arch: arm64
          - target: windows
            arch: amd64

    steps:
      - name: Store build timestamp
        run: echo "BUILD_TIME=$(date -u +'%F_%T')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile and release
        uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.target }}
          goarch: ${{ matrix.arch }}
          goversion: ${{ env.GO_VER }}
          binary_name: "migration-manager"
          build_flags: "-v"
          ldflags: "-X 'main.version=${{ env.APP_VER }}' -X 'main.commit=${{ env.COMMIT }}' -X 'main.date=${{ env.BUILD_TIME }}'"
          extra_files: README.md
          md5sum: FALSE
          overwrite: TRUE
          compress_assets: TRUE
